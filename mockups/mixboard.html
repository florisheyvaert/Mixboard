<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixboard mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Permanent+Marker&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --plate: #c9ccc6;          /* brushed aluminium faceplate */
  --plate-hi: #dcdfd9;
  --plate-lo: #a9ada6;
  --groove: #8d918a;
  --ink: #2b2e2c;            /* silkscreen print */
  --ink-soft: #5a5f5b;
  --tape: #efe6c8;           /* scribble-strip masking tape */
  --marker: #23262b;
  --glass: #14211f;          /* VFD display glass */
  --vfd: #7ff5d8;
  --vfd-dim: #2f5f55;
  --led-armed: #3fbf6a;
  --led-hit: #ffb21e;
  --mute: #ff5a36;
  --cap-covers: #2f6db5;
  --cap-lighting: #e0a526;
  --cap-climate: #c2452d;
  --cap-notify: #6c7f74;
  --focus: #1d5fd1;
  --shadow: rgba(30, 32, 30, .35);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plate: #2d3032; --plate-hi: #3a3e41; --plate-lo: #232628; --groove: #1a1c1d;
    --ink: #d7dad4; --ink-soft: #9ba19b; --focus: #7fb0ff; --shadow: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plate: #2d3032; --plate-hi: #3a3e41; --plate-lo: #232628; --groove: #1a1c1d;
  --ink: #d7dad4; --ink-soft: #9ba19b; --focus: #7fb0ff; --shadow: rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--plate);
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
                    repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 1px, transparent 1px 7px);
  color: var(--ink);
  font: 500 16px/1.35 "Barlow Condensed", "Arial Narrow", sans-serif;
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Meter bridge (header) ──────────────────────────────── */
.bridge {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding: 14px 24px; background: var(--plate-lo);
  border-bottom: 1px solid var(--groove); box-shadow: inset 0 -1px 0 var(--plate-hi);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { margin: 0; font-weight: 700; font-size: 26px; letter-spacing: .02em; }
.brand span { color: var(--ink-soft); font-size: 15px; }
.display {
  background: var(--glass); color: var(--vfd); border-radius: 4px;
  font-family: "Share Tech Mono", monospace; text-shadow: 0 0 6px rgba(127,245,216,.55);
  box-shadow: inset 0 2px 6px rgba(0,0,0,.7), 0 1px 0 var(--plate-hi);
}
.search { display: flex; align-items: center; padding: 0 10px; height: 38px; width: min(320px, 100%); }
.search input {
  all: unset; flex: 1; font: 17px "Share Tech Mono", monospace; color: var(--vfd); caret-color: var(--vfd);
}
.search input::placeholder { color: var(--vfd-dim); text-shadow: none; }
.search:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.solo-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.solo-row .silk { margin-right: 4px; }
.key {
  border: 0; cursor: pointer; border-radius: 4px; padding: 6px 12px; min-height: 34px;
  background: linear-gradient(var(--plate-hi), var(--plate)); color: var(--ink);
  box-shadow: 0 2px 0 var(--groove), 0 3px 4px var(--shadow), inset 0 1px 0 rgba(255,255,255,.4);
  transition: transform .06s, box-shadow .06s;
}
.key:active { transform: translateY(2px); box-shadow: 0 0 0 var(--groove), 0 1px 2px var(--shadow); }
.key[aria-pressed="true"] { box-shadow: 0 0 0 var(--groove), inset 0 2px 4px var(--shadow); transform: translateY(2px); }
.key .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.key[aria-pressed="true"] .dot { box-shadow: 0 0 8px var(--c), 0 0 0 1px rgba(0,0,0,.25); }
.silk { font-size: 13px; color: var(--ink-soft); letter-spacing: .03em; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 230px; padding: 6px;
  background: var(--plate-hi); border-radius: 6px; box-shadow: 0 8px 24px var(--shadow); display: none;
}
.menu.open { display: block; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 4px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--plate); }
.menu small { display: block; color: var(--ink-soft); font-size: 13px; }
.menu hr { border: 0; border-top: 1px solid var(--groove); margin: 6px 0; }

/* ── Board ──────────────────────────────────────────────── */
.board { display: flex; flex-wrap: wrap; gap: 22px; padding: 22px 24px 80px; align-items: flex-start; }
.group {
  background: var(--plate); border-radius: 6px; position: relative; max-width: 100%;
  box-shadow: 0 1px 0 var(--plate-hi) inset, 0 0 0 1px var(--groove), 0 6px 14px var(--shadow);
}
.group > header {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px 7px;
  border-top: 5px solid var(--c); border-radius: 6px 6px 0 0; font-weight: 600; font-size: 17px;
}
.group > header .count { color: var(--ink-soft); font-weight: 500; font-size: 14px; }
.strips { display: flex; overflow-x: auto; scrollbar-width: thin; }
.screw { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--plate-hi), var(--groove)); top: 12px; right: 12px; }
.screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 4px; height: 1px; background: var(--ink-soft); transform: rotate(35deg); }

.strip {
  width: min-content; min-width: 132px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 12px 10px 14px; border-left: 1px solid var(--plate-hi); border-right: 1px solid var(--groove);
}
.strip:first-child { border-left: 0; }
.strip:last-child { border-right: 0; }
.strip.muted .controls, .strip.muted .tape { opacity: .45; }

.tape {
  width: 100%; min-height: 50px; border: 0; cursor: pointer; padding: 6px 6px 5px;
  background: var(--tape); color: var(--marker); font: 17px/1.08 "Permanent Marker", cursive;
  transform: rotate(-1.2deg); text-align: center;
  clip-path: polygon(0 4%, 6% 0, 18% 5%, 33% 1%, 52% 4%, 70% 0, 86% 4%, 100% 1%, 99% 96%, 90% 100%, 72% 96%, 50% 100%, 30% 95%, 12% 100%, 1% 97%);
  box-shadow: 0 1px 2px var(--shadow);
}
.strip:nth-child(2n) .tape { transform: rotate(.9deg); }
.tape:hover { filter: brightness(1.04); }

.ledline { display: flex; align-items: center; gap: 7px; width: 100%; justify-content: center; }
.led { width: 9px; height: 9px; border-radius: 50%; background: #3a3d3a; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); flex: none; }
.led.armed { background: var(--led-armed); box-shadow: 0 0 6px var(--led-armed); }
.led.hit { animation: hit 1.4s ease-out; }
@keyframes hit {
  0%, 30% { background: var(--led-hit); box-shadow: 0 0 14px 3px var(--led-hit); }
  100% { background: var(--led-armed); box-shadow: 0 0 6px var(--led-armed); }
}
.strip.muted .led { background: #3a3d3a; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }

.controls { display: flex; gap: 10px; justify-content: center; align-items: flex-end; flex: 1; min-height: 210px; width: 100%; }
.controls.empty { align-items: center; text-align: center; color: var(--ink-soft); font-size: 14px; padding: 0 4px; }
.ctl { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ctl .silk { text-align: center; }
.readout { font-size: 15px; padding: 3px 6px; min-width: 52px; text-align: center; white-space: nowrap; }

/* Fader */
.fader { position: relative; width: 40px; height: var(--h, 150px); cursor: ns-resize; touch-action: none; }
.fader .scale {
  position: absolute; top: 10px; bottom: 9px; left: 2px; width: 8px;
  background: linear-gradient(var(--ink-soft) 0 1px, transparent 1px) 0 0 / 100% 10% repeat-y;
  border-bottom: 1px solid var(--ink-soft);
}
.fader .slot {
  position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-50%);
  background: #121413; border-radius: 3px; box-shadow: inset 0 1px 2px #000, 0 1px 0 var(--plate-hi);
}
.fader .cap {
  position: absolute; left: 50%; width: 34px; height: 20px; transform: translate(-50%, 50%);
  bottom: calc(var(--p) * (100% - 20px) + 0px); margin-bottom: 0;
  border-radius: 3px; background: linear-gradient(#ffffff38, transparent 45%, #00000030), var(--cap, #555);
  box-shadow: 0 3px 5px var(--shadow), inset 0 -2px 0 rgba(0,0,0,.25);
}
.fader .cap { bottom: calc(var(--p) * (100% - 20px)); transform: translate(-50%, 0); }
.fader .cap::after { content: ""; position: absolute; left: 3px; right: 3px; top: 9px; height: 2px; background: rgba(255,255,255,.85); }
.fader.lg { --h: 240px; width: 56px; }
.fader.lg .cap { width: 44px; height: 24px; bottom: calc(var(--p) * (100% - 24px)); }
.fader.lg .cap::after { top: 11px; }
.fader.lg .ticks { position: absolute; left: -30px; top: 0; bottom: 0; width: 26px; font-size: 12px; color: var(--ink-soft); text-align: right; }
.fader.lg .ticks span { position: absolute; right: 0; transform: translateY(50%); }

/* Knob */
.knob { cursor: ns-resize; touch-action: none; display: block; }
.knob .body { fill: url(#knobGrad); stroke: rgba(0,0,0,.35); }
.knob .tick { stroke: var(--ink-soft); stroke-width: 1.4; }
.knob .arc { fill: none; stroke: var(--cap); stroke-width: 3; stroke-linecap: round; }
.knob .arc-bg { fill: none; stroke: var(--groove); stroke-width: 3; stroke-linecap: round; }
.knob .pointer { stroke: #fff; stroke-width: 3; stroke-linecap: round; }
.knob .capdot { fill: var(--cap); }

/* Rotary switch */
.rotary { position: relative; width: var(--s, 70px); height: var(--s, 70px); }
.rotary .opt { position: absolute; font-size: 12px; color: var(--ink-soft); background: none; border: 0; padding: 2px; cursor: pointer; transform: translate(-50%, -50%); white-space: nowrap; }
.rotary .opt.on { color: var(--ink); font-weight: 700; }
.rotary.lg { --s: 150px; }
.rotary.lg .opt { font-size: 15px; }

/* Lit button */
.lit {
  width: 46px; height: 46px; border: 0; border-radius: 6px; cursor: pointer;
  background: linear-gradient(#ffffff22, transparent), #575c58;
  box-shadow: 0 3px 0 #2a2d2b, 0 4px 6px var(--shadow); color: #c8ccc6; font-size: 13px; font-weight: 600;
  transition: transform .06s, box-shadow .06s, background .15s;
}
.lit[aria-pressed="true"] {
  background: radial-gradient(circle at 50% 40%, #fff6, transparent 70%), var(--cap);
  color: #fff; box-shadow: 0 1px 0 #2a2d2b, 0 0 16px var(--cap); transform: translateY(2px);
}
.lit.lg { width: 74px; height: 74px; font-size: 16px; }

/* Time display */
.timebox { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.timebox .readout { font-size: 20px; padding: 4px 8px; }
.nudges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.nudge { border: 0; border-radius: 3px; padding: 2px 6px; min-width: 28px; min-height: 26px; cursor: pointer; font-size: 14px;
  background: linear-gradient(var(--plate-hi), var(--plate)); box-shadow: 0 2px 0 var(--groove); }
.nudge:active { transform: translateY(2px); box-shadow: none; }
.timebox.lg .readout { font-size: 34px; padding: 6px 14px; }

/* Transport + mute */
.transport { display: flex; gap: 6px; width: 100%; }
.transport .key { flex: 1; padding: 6px 4px; font-size: 15px; }
.mute {
  width: 100%; border: 0; cursor: pointer; border-radius: 4px; min-height: 34px; font-weight: 600;
  background: linear-gradient(#ffffff20, transparent), #4a4e4b; color: #d7dad4;
  box-shadow: 0 2px 0 #262927, 0 3px 4px var(--shadow);
}
.mute[aria-pressed="true"] { background: var(--mute); color: #fff; box-shadow: 0 0 0 #262927, 0 0 14px var(--mute); transform: translateY(2px); }

.empty-state { padding: 60px 24px; max-width: 520px; }
.empty-state p { font-size: 20px; margin: 0 0 14px; }

/* ── Channel view ───────────────────────────────────────── */
.channel {
  position: fixed; inset: 0; z-index: 10; overflow-y: auto; display: none;
  background-color: var(--plate);
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
}
.channel.open { display: block; animation: slidein .22s ease-out; }
@keyframes slidein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.channel-inner { max-width: 980px; margin: 0 auto; padding: 18px 24px 60px; }
.ch-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-top: 6px solid var(--c); padding-top: 14px; }
.ch-head .tape { width: auto; min-height: 0; font-size: 30px; padding: 8px 22px; cursor: default; }
.ch-head .meta { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.ch-head .mute { width: auto; padding: 0 18px; }
.sentence {
  margin: 28px 0 8px; font-size: 26px; line-height: 1.6; max-width: 34em; font-weight: 500;
}
.chip {
  display: inline-block; border: 0; cursor: pointer; padding: 0 10px; margin: 0 2px; border-radius: 4px; font-size: 22px; line-height: 1.45;
  vertical-align: 1px;
}
.chip:hover { filter: brightness(1.2); }
.hint { color: var(--ink-soft); font-size: 15px; margin: 0 0 26px; }
.deck {
  display: flex; flex-wrap: wrap; gap: 0; border-radius: 6px; background: var(--plate);
  box-shadow: 0 1px 0 var(--plate-hi) inset, 0 0 0 1px var(--groove), 0 6px 14px var(--shadow);
}
.deck .cell {
  flex: 1 1 200px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 16px 20px;
  border-right: 1px solid var(--groove); box-shadow: 1px 0 0 var(--plate-hi);
}
.deck .cell:last-child { border-right: 0; box-shadow: none; }
.deck .cell h3 { margin: 0; font-size: 19px; font-weight: 600; text-align: center; }
.deck .cell code { font: 12px "Share Tech Mono", monospace; color: var(--ink-soft); }
.deck .cell .via { font-size: 13px; color: var(--ink-soft); text-align: center; }
.deck .cell .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 260px; padding-left: 26px; }
.cell.flash { animation: flash 1s ease-out; }
@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--c) 22%, transparent); } }
.ch-foot { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 22px; }
.ch-foot a { color: var(--ink); font-size: 17px; }
.ch-foot .spacer { flex: 1; }
.ch-foot .key { padding: 8px 18px; font-size: 17px; }
.explain { font-size: 14px; color: var(--ink-soft); margin-top: 10px; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); opacity: 0; z-index: 20;
  padding: 10px 18px; font-size: 18px; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Mobile */
@media (max-width: 700px) {
  .bridge { padding: 12px 16px; position: static; }
  .search { width: 100%; }
  .board { padding: 16px 16px 70px; gap: 16px; }
  .group { width: 100%; }
  .channel-inner { padding: 14px 16px 50px; }
  .sentence { font-size: 21px; }
  .chip { font-size: 19px; }
  .ch-head .tape { font-size: 24px; }
  .deck .cell { flex-basis: 50%; border-bottom: 1px solid var(--groove); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="knobGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#6b706c"/><stop offset=".7" stop-color="#3b3f3c"/><stop offset="1" stop-color="#2a2d2b"/>
    </radialGradient>
  </defs>
</svg>

<header class="bridge">
  <div class="brand"><h1>Mixboard</h1><span>Tune your automations</span></div>
  <label class="search display"><span class="sr">Search automations and helpers</span>
    <input id="q" type="search" placeholder="search channels…" autocomplete="off">
  </label>
  <div class="solo-row" id="solo" role="group" aria-label="Solo a group"><span class="silk">solo</span></div>
  <button class="key" id="withHelpers" aria-pressed="true" title="Hide automations without helpers">With helpers</button>
  <div class="menu-wrap">
    <button class="key" id="profilesBtn" aria-haspopup="true" aria-expanded="false">Profiles</button>
    <div class="menu" id="profilesMenu" role="menu"></div>
  </div>
  <button class="key" id="themeBtn" title="Switch light / dark panel">Panel</button>
</header>

<main class="board" id="board" aria-label="Automations"></main>

<section class="channel" id="channel" aria-label="Automation settings"></section>
<div class="toast display" id="toast" role="status" aria-live="polite"></div>

<script>
/* ── Mock data (shaped like the HA states Mixboard will read) ── */
const groups = [
  { id: "covers",   name: "Covers",        c: "var(--cap-covers)" },
  { id: "lighting", name: "Lighting",      c: "var(--cap-lighting)" },
  { id: "climate",  name: "Climate",       c: "var(--cap-climate)" },
  { id: "notify",   name: "Notifications", c: "var(--cap-notify)" },
];
const H = {
  sunset_delay:  { eid: "input_number.shutters_sunset_delay", name: "Delay after sunset", short: "delay", type: "number", min: 0, max: 120, step: 5, unit: "min", value: 30, control: "fader" },
  close_all:     { eid: "input_boolean.shutters_close_all", name: "Close every shutter", short: "all", type: "boolean", value: true, words: ["only the living room", "every shutter"] },
  mode:          { eid: "input_select.shutters_mode", name: "Shutter mode", short: "mode", type: "select", options: ["Normal", "Storm", "Holiday"], value: "Normal" },
  sunrise_delay: { eid: "input_number.shutters_sunrise_delay", name: "Delay after sunrise", short: "delay", type: "number", min: 0, max: 120, step: 5, unit: "min", value: 10, control: "fader" },
  earliest_open: { eid: "input_datetime.shutters_earliest_open", name: "Never open before", short: "not before", type: "time", value: "07:30" },
  blackout_time: { eid: "input_datetime.bedroom_blackout_time", name: "Close at", short: "close", type: "time", value: "21:30" },
  night_level:   { eid: "input_number.hall_night_brightness", name: "Night brightness", short: "night", type: "number", min: 1, max: 100, step: 1, unit: "%", value: 20, control: "knob" },
  night_start:   { eid: "input_datetime.hall_night_start", name: "Night starts", short: "from", type: "time", value: "23:00" },
  night_end:     { eid: "input_datetime.hall_night_end", name: "Night ends", short: "until", type: "time", value: "06:30" },
  day_level:     { eid: "input_number.hall_day_brightness", name: "Day brightness", short: "day", type: "number", min: 1, max: 100, step: 1, unit: "%", value: 80, control: "knob" },
  garden_offset: { eid: "input_number.garden_sunset_offset", name: "Switch on after sunset", short: "offset", type: "number", min: 0, max: 60, step: 5, unit: "min", value: 15, control: "fader" },
  garden_off:    { eid: "input_datetime.garden_off_time", name: "Switch off at", short: "off", type: "time", value: "22:00" },
  humidity:      { eid: "input_number.bath_humidity_threshold", name: "Start above humidity", short: "humidity", type: "number", min: 40, max: 90, step: 1, unit: "%", value: 65, control: "knob" },
  runon:         { eid: "input_number.bath_fan_runon", name: "Keep running for", short: "run-on", type: "number", min: 0, max: 30, step: 1, unit: "min", value: 10, control: "fader" },
};
const automations = [
  { id: "sunset_shutters", name: "Sunset shutters", group: "covers", enabled: true, last: "today 18:42",
    helpers: ["sunset_delay", "close_all", "mode"], primary: ["sunset_delay"],
    sentence: "When the sun sets, wait {sunset_delay}, then close {close_all}. Mode: {mode}." },
  { id: "sunrise_shutters", name: "Sunrise shutters", group: "covers", enabled: true, last: "today 07:55",
    helpers: ["sunrise_delay", "earliest_open", "mode"], primary: ["sunrise_delay", "earliest_open"], via: { mode: "script.shutters_open" },
    sentence: "When the sun rises, wait {sunrise_delay}, but never open before {earliest_open}." },
  { id: "bedroom_blackout", name: "Bedroom blackout", group: "covers", enabled: false, last: "3 days ago",
    helpers: ["blackout_time"], primary: ["blackout_time"],
    sentence: "Close the bedroom blackout blind at {blackout_time}." },
  { id: "hall_night", name: "Hall night mode", group: "lighting", enabled: true, last: "yesterday 23:00",
    helpers: ["night_level", "night_start", "night_end"], primary: ["night_level", "night_start"],
    sentence: "Between {night_start} and {night_end}, motion turns the hall lights on at {night_level}." },
  { id: "hall_day", name: "Hall day brightness", group: "lighting", enabled: true, last: "today 06:30",
    helpers: ["day_level"], primary: ["day_level"],
    sentence: "Outside night hours, motion turns the hall lights on at {day_level}." },
  { id: "garden_path", name: "Garden path", group: "lighting", enabled: true, last: "yesterday 17:21",
    helpers: ["garden_offset", "garden_off"], primary: ["garden_offset", "garden_off"],
    sentence: "Turn the garden path lights on {garden_offset} after sunset and off at {garden_off}." },
  { id: "bath_fan", name: "Bathroom fan", group: "climate", enabled: true, last: "today 08:12",
    helpers: ["humidity", "runon"], primary: ["humidity", "runon"],
    sentence: "Start the bathroom fan above {humidity} humidity and keep it running {runon} after it drops." },
  { id: "washer_done", name: "Washing machine done", group: "notify", enabled: true, last: "2 days ago", helpers: [], primary: [] },
  { id: "door_open", name: "Front door left open", group: "notify", enabled: true, last: "never", helpers: [], primary: [] },
];
const profiles = [
  { name: "Summer", note: "Late evenings, early mornings", values: { sunset_delay: 15, sunrise_delay: 0, garden_offset: 30, night_start: "23:30" } },
  { name: "Autumn", note: "Shutters later, lights sooner", values: { sunset_delay: 30, sunrise_delay: 10, garden_offset: 15, night_start: "23:00" } },
  { name: "Winter", note: "Dark early, slow mornings", values: { sunset_delay: 45, sunrise_delay: 20, garden_offset: 5, night_start: "22:30" } },
];

/* ── State ── */
const ui = { q: "", solo: null, withHelpers: true };
const groupOf = id => groups.find(g => g.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function fmt(h) {
  if (h.type === "boolean") return h.value ? "on" : "off";
  if (h.type !== "number") return h.value;
  if (h.unit === "min" && h.value >= 60) { const m = h.value % 60; return `${Math.floor(h.value / 60)} h${m ? " " + m : ""}`; }
  return h.unit === "%" ? `${h.value}%` : `${h.value} ${h.unit}`;
}
const pct = h => (h.value - h.min) / (h.max - h.min);

/* ── Control renderers ── */
function faderHTML(k, lg) {
  const h = H[k];
  const ticks = lg ? `<div class="ticks">${[0, .25, .5, .75, 1].map(t => {
    const v = Math.round(h.min + t * (h.max - h.min));
    return `<span style="bottom:calc(${t} * (100% - 24px) + 12px)">${v}</span>`; }).join("")}</div>` : "";
  return `<div class="fader ${lg ? "lg" : ""}" data-h="${k}" data-kind="fader" role="slider" tabindex="0"
      aria-label="${esc(h.name)}" aria-valuemin="${h.min}" aria-valuemax="${h.max}" aria-valuenow="${h.value}" aria-valuetext="${fmt(h)}"
      style="--p:${pct(h)}">${ticks}<div class="scale"></div><div class="slot"></div><div class="cap"></div></div>`;
}
function arc(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.cos((a - 90) * Math.PI / 180), cy + r * Math.sin((a - 90) * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
}
function knobSVG(k, size) {
  const h = H[k], c = size / 2, r = size * .3, a = -135 + 270 * pct(h);
  const ticks = Array.from({ length: 11 }, (_, i) => {
    const t = (-135 + 27 * i - 90) * Math.PI / 180, r1 = size * .43, r2 = size * .48;
    return `<line class="tick" x1="${c + r1 * Math.cos(t)}" y1="${c + r1 * Math.sin(t)}" x2="${c + r2 * Math.cos(t)}" y2="${c + r2 * Math.sin(t)}"/>`; }).join("");
  return `<svg class="knob" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" data-h="${k}" data-kind="knob" data-size="${size}"
      role="slider" tabindex="0" aria-label="${esc(h.name)}" aria-valuemin="${h.min}" aria-valuemax="${h.max}" aria-valuenow="${h.value}" aria-valuetext="${fmt(h)}">
    ${ticks}<path class="arc-bg" d="${arc(c, c, size * .38, -135, 135)}"/><path class="arc" d="${arc(c, c, size * .38, -135, Math.max(a, -134.9))}"/>
    <circle class="body" cx="${c}" cy="${c}" r="${r}"/>
    <line class="pointer" x1="${c}" y1="${c}" x2="${c}" y2="${c - r + 4}" transform="rotate(${a} ${c} ${c})"/></svg>`;
}
function rotaryHTML(k, lg) {
  const h = H[k], size = lg ? 150 : 70, n = h.options.length, idx = h.options.indexOf(h.value);
  const ang = i => -60 + (120 / (n - 1)) * i;
  const knob = lg ? 80 : 40, c = size / 2, r = knob / 2;
  const opts = lg ? h.options.map((o, i) => {
    const t = (ang(i) - 90) * Math.PI / 180, R = size * .52;
    return `<button class="opt ${i === idx ? "on" : ""}" data-opt="${esc(o)}" style="left:${c + R * Math.cos(t)}px;top:${c + 6 + R * Math.sin(t)}px">${esc(o)}</button>`; }).join("") : "";
  return `<div class="rotary ${lg ? "lg" : ""}" data-h="${k}" data-kind="rotary">
    ${opts}
    <svg class="knob" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="slider" tabindex="0" aria-label="${esc(h.name)}"
      aria-valuetext="${esc(h.value)}" aria-valuenow="${idx}" aria-valuemin="0" aria-valuemax="${n - 1}" style="cursor:pointer">
      <circle class="body" cx="${c}" cy="${c + 6}" r="${r}"/>
      <line class="pointer" x1="${c}" y1="${c + 6}" x2="${c}" y2="${c + 6 - r + 5}" transform="rotate(${ang(idx)} ${c} ${c + 6})"/>
    </svg></div>`;
}
function litHTML(k, lg) {
  const h = H[k];
  return `<button class="lit ${lg ? "lg" : ""}" data-h="${k}" data-kind="lit" aria-pressed="${h.value}" aria-label="${esc(h.name)}">${h.value ? "on" : "off"}</button>`;
}
function timeHTML(k, lg) {
  const h = H[k];
  const steps = lg ? [-60, -15, 15, 60] : [-15, 15];
  const label = s => (s < 0 ? "−" : "+") + (Math.abs(s) === 60 ? "1 h" : Math.abs(s));
  return `<div class="timebox ${lg ? "lg" : ""}" data-h="${k}" data-kind="time">
    <div class="readout display" aria-live="off">${h.value}</div>
    <div class="nudges">${steps.map(s => `<button class="nudge" data-step="${s}" aria-label="${s < 0 ? "Earlier" : "Later"} by ${Math.abs(s)} minutes">${label(s)}</button>`).join("")}</div></div>`;
}
function controlHTML(k, lg) {
  const h = H[k];
  if (h.type === "number" && h.control === "fader") return faderHTML(k, lg);
  if (h.type === "number") return knobSVG(k, lg ? 150 : 68);
  if (h.type === "select") return rotaryHTML(k, lg);
  if (h.type === "boolean") return litHTML(k, lg);
  return timeHTML(k, lg);
}
const showsReadout = h => h.type === "number" || h.type === "select";

/* ── Board ── */
function visible(a) {
  if (ui.solo && a.group !== ui.solo) return false;
  if (ui.withHelpers && !a.helpers.length) return false;
  if (!ui.q) return true;
  const hay = [a.name, a.sentence || "", ...a.helpers.flatMap(k => [H[k].name, H[k].eid])].join(" ").toLowerCase();
  return hay.includes(ui.q.toLowerCase());
}
function stripHTML(a) {
  const g = groupOf(a.group);
  const ctl = a.primary.length
    ? `<div class="controls">${a.primary.map(k => `<div class="ctl" style="--cap:${g.c}">
        ${showsReadout(H[k]) ? `<div class="readout display" data-readout="${k}">${esc(fmt(H[k]))}</div>` : ""}
        ${controlHTML(k, false)}<span class="silk">${esc(H[k].short)}</span></div>`).join("")}</div>`
    : `<div class="controls empty">No helpers linked</div>`;
  return `<article class="strip ${a.enabled ? "" : "muted"}" data-a="${a.id}">
    <button class="tape" data-open="${a.id}" title="Open all settings">${esc(a.name)}</button>
    <div class="ledline"><span class="led ${a.enabled ? "armed" : ""}" data-led="${a.id}"></span><span class="silk">${esc(a.last)}</span></div>
    ${ctl}
    <div class="transport">
      <button class="key" data-trigger="${a.id}" title="Run if the conditions pass">Trigger</button>
      <button class="key" data-run="${a.id}" title="Run the actions now, skip conditions">Run</button>
    </div>
    <button class="mute" data-mute="${a.id}" aria-pressed="${!a.enabled}" title="Mute disables the automation">${a.enabled ? "Mute" : "Muted"}</button>
  </article>`;
}
function renderBoard() {
  const board = document.getElementById("board");
  const blocks = groups.map(g => {
    const list = automations.filter(a => a.group === g.id && visible(a));
    if (!list.length) return "";
    return `<section class="group" style="--c:${g.c}" aria-label="${g.name}"><span class="screw"></span>
      <header>${g.name} <span class="count">${list.length} ${list.length === 1 ? "channel" : "channels"}</span></header>
      <div class="strips">${list.map(stripHTML).join("")}</div></section>`;
  }).join("");
  board.innerHTML = blocks || `<div class="empty-state"><p>No automation matches “${esc(ui.q)}”${ui.solo ? " in " + groupOf(ui.solo).name : ""}.</p>
    <button class="key" id="clearFilters">Show all ${automations.length} automations</button></div>`;
}
function renderSolo() {
  document.getElementById("solo").insertAdjacentHTML("beforeend", groups.map(g =>
    `<button class="key" data-solo="${g.id}" aria-pressed="false" style="--c:${g.c}"><span class="dot"></span>${g.name}</button>`).join(""));
}

/* ── Channel view ── */
function sentenceHTML(a) {
  const g = groupOf(a.group);
  return esc(a.sentence).replace(/\{(\w+)\}/g, (_, k) => {
    const h = H[k];
    const text = h.type === "boolean" ? h.words[h.value ? 1 : 0] : fmt(h);
    return `<button class="chip display" data-chip="${k}" title="Change ${esc(h.name.toLowerCase())}">${esc(text)}</button>`;
  });
}
function renderChannel(id) {
  const a = automations.find(x => x.id === id), g = groupOf(a.group), el = document.getElementById("channel");
  el.innerHTML = `<div class="channel-inner" style="--c:${g.c}">
    <div class="ch-head">
      <button class="key" data-back aria-label="Back to the board">Board</button>
      <span class="tape">${esc(a.name)}</span>
      <div class="meta"><span class="led ${a.enabled ? "armed" : ""}" data-led="${a.id}"></span><span class="silk">${g.name} · last run ${esc(a.last)}</span></div>
      <button class="mute" data-mute="${a.id}" aria-pressed="${!a.enabled}">${a.enabled ? "Mute" : "Muted"}</button>
    </div>
    ${a.sentence ? `<p class="sentence">${sentenceHTML(a)}</p><p class="hint">Click a value in the sentence to jump to its control.</p>` : `<p class="hint" style="margin-top:24px">This automation has no linked helpers yet. Add a helper to it in Home Assistant, or pin one here.</p>`}
    <div class="deck">${a.helpers.map(k => `<div class="cell" data-cell="${k}" style="--cap:${g.c}">
        <h3>${esc(H[k].name)}</h3><code>${H[k].eid}</code>
        ${a.via && a.via[k] ? `<span class="via">linked through ${a.via[k]}</span>` : ""}
        <div class="stage">${controlHTML(k, true)}</div>
        ${showsReadout(H[k]) ? `<div class="readout display" data-readout="${k}" style="font-size:22px">${esc(fmt(H[k]))}</div>` : ""}
        ${H[k].unit === "min" ? `<div class="nudges">${[-15, -5, 5, 15].map(s => `<button class="nudge" data-bump="${k}" data-step="${s}">${s > 0 ? "+" : "−"}${Math.abs(s)}</button>`).join("")}</div>` : ""}
      </div>`).join("")}</div>
    <div class="ch-foot">
      <a href="#" onclick="return false">Open trace</a>
      <a href="#" onclick="return false">Edit in Home Assistant</a>
      <span class="spacer"></span>
      <button class="key" data-trigger="${a.id}">Trigger</button>
      <button class="key" data-run="${a.id}">Run</button>
    </div>
    <p class="explain">Trigger runs the automation only if its conditions pass. Run skips the conditions and does the actions now. Mute disables the automation until you unmute it.</p>
  </div>`;
  el.classList.add("open");
  el.scrollTop = 0;
  el.querySelector("[data-back]").focus();
}
let lastOpener = null;
function closeChannel() {
  const el = document.getElementById("channel");
  if (!el.classList.contains("open")) return;
  el.classList.remove("open"); el.innerHTML = "";
  renderBoard();
  const back = lastOpener && document.querySelector(`[data-open="${lastOpener}"]`); if (back) back.focus();
}

/* ── Value changes ── */
let toastTimer, settleTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function setValue(k, v, quiet) {
  const h = H[k];
  if (h.type === "number") v = Math.min(h.max, Math.max(h.min, Math.round(v / h.step) * h.step));
  if (h.value === v) return;
  h.value = v;
  refresh(k);
  if (!quiet) { clearTimeout(settleTimer); settleTimer = setTimeout(() => toast(`${h.name} set to ${fmt(h)}`), 450); }
}
function refresh(k) {
  const h = H[k];
  document.querySelectorAll(`[data-h="${k}"]`).forEach(el => {
    const kind = el.dataset.kind;
    if (kind === "fader") { el.style.setProperty("--p", pct(h)); el.setAttribute("aria-valuenow", h.value); el.setAttribute("aria-valuetext", fmt(h)); }
    else if (kind === "knob") { el.outerHTML = knobSVG(k, +el.dataset.size); }
    else if (kind === "rotary" || kind === "lit" || kind === "time") {
      const focused = el.contains(document.activeElement); const lg = el.classList.contains("lg");
      const sel = focused ? (document.activeElement.dataset.step ? `[data-step="${document.activeElement.dataset.step}"]` : document.activeElement.dataset.opt ? null : ".knob, .lit") : null;
      el.outerHTML = kind === "rotary" ? rotaryHTML(k, lg) : kind === "lit" ? litHTML(k, lg) : timeHTML(k, lg);
      if (focused) { const fresh = [...document.querySelectorAll(`[data-h="${k}"]`)].find(n => n.classList.contains("lg") === lg);
        const target = fresh && (fresh.matches(".lit") ? fresh : sel ? fresh.querySelector(sel) : fresh.querySelector(".opt.on")); if (target) target.focus(); }
    }
  });
  document.querySelectorAll(`[data-readout="${k}"]`).forEach(el => el.textContent = fmt(h));
  document.querySelectorAll(`[data-chip="${k}"]`).forEach(el => el.textContent = h.type === "boolean" ? h.words[h.value ? 1 : 0] : fmt(h));
}
function shiftTime(k, minutes) {
  const [hh, mm] = H[k].value.split(":").map(Number);
  const t = ((hh * 60 + mm + minutes) % 1440 + 1440) % 1440;
  setValue(k, `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`);
}
function cycleSelect(k, dir = 1) {
  const h = H[k], i = h.options.indexOf(h.value);
  setValue(k, h.options[(i + dir + h.options.length) % h.options.length]);
}

/* Drag: faders follow the pointer, knobs turn with vertical drag */
let drag = null;
document.addEventListener("pointerdown", e => {
  const f = e.target.closest('[data-kind="fader"]');
  const kn = e.target.closest('[data-kind="knob"]');
  if (!f && !kn) return;
  e.preventDefault();
  if (f) { drag = { kind: "fader", el: f, k: f.dataset.h }; moveFader(e); f.focus(); }
  else { drag = { kind: "knob", k: kn.dataset.h, y: e.clientY, v: H[kn.dataset.h].value }; kn.focus(); }
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (drag.kind === "fader") moveFader(e);
  else { const h = H[drag.k]; setValue(drag.k, drag.v + (drag.y - e.clientY) * (h.max - h.min) / 160); }
});
document.addEventListener("pointerup", () => { drag = null; });
function moveFader(e) {
  const h = H[drag.k], slot = drag.el.getBoundingClientRect();
  const capH = drag.el.classList.contains("lg") ? 24 : 20;
  const p = 1 - (e.clientY - slot.top - capH / 2) / (slot.height - capH);
  setValue(drag.k, h.min + Math.min(1, Math.max(0, p)) * (h.max - h.min));
}

/* Keyboard on sliders */
document.addEventListener("keydown", e => {
  const s = e.target.closest('[role="slider"]');
  if (s) {
    const wrap = s.closest("[data-h]"); const k = wrap.dataset.h, h = H[k];
    const up = ["ArrowUp", "ArrowRight", "PageUp"].includes(e.key), down = ["ArrowDown", "ArrowLeft", "PageDown"].includes(e.key);
    if (!up && !down) return;
    e.preventDefault();
    if (h.type === "select") return cycleSelect(k, up ? 1 : -1);
    const big = e.key.startsWith("Page") ? 5 : 1;
    setValue(k, h.value + (up ? 1 : -1) * h.step * big);
    const again = [...document.querySelectorAll(`[data-h="${k}"]`)].find(n => n.matches('[role="slider"]') && n.dataset.size === s.dataset.size && n.classList.contains("lg") === s.classList.contains("lg"));
    if (again && again !== s) again.focus();
  }
  if (e.key === "Escape") { closeMenu(); closeChannel(); }
});

/* Clicks */
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-kind='rotary'] svg");
  if (!t) { closeMenu(); return; }
  const d = t.dataset;
  if (d.open) { lastOpener = d.open; renderChannel(d.open); return; }
  if ("back" in d) { closeChannel(); return; }
  if (d.trigger || d.run) {
    const id = d.trigger || d.run, a = automations.find(x => x.id === id);
    if (!a.enabled) { toast(`${a.name} is muted. Unmute it to run it.`); return; }
    document.querySelectorAll(`[data-led="${id}"]`).forEach(l => { l.classList.remove("hit"); void l.offsetWidth; l.classList.add("hit"); });
    a.last = "just now";
    toast(d.trigger ? `${a.name} triggered` : `${a.name}: actions ran`);
    return;
  }
  if (d.mute) {
    const a = automations.find(x => x.id === d.mute); a.enabled = !a.enabled;
    document.querySelectorAll(`[data-mute="${a.id}"]`).forEach(b => { b.setAttribute("aria-pressed", !a.enabled); b.textContent = a.enabled ? "Mute" : "Muted"; });
    document.querySelectorAll(`[data-led="${a.id}"]`).forEach(l => l.classList.toggle("armed", a.enabled));
    document.querySelectorAll(`[data-a="${a.id}"]`).forEach(s => s.classList.toggle("muted", !a.enabled));
    toast(a.enabled ? `${a.name} unmuted` : `${a.name} muted`);
    return;
  }
  if (d.chip) {
    const cell = document.querySelector(`[data-cell="${d.chip}"]`);
    cell.scrollIntoView({ behavior: "smooth", block: "center" });
    cell.classList.remove("flash"); void cell.offsetWidth; cell.classList.add("flash");
    const ctl = cell.querySelector('[role="slider"], .lit, .nudge'); if (ctl) ctl.focus({ preventScroll: true });
    return;
  }
  if (d.bump) { setValue(d.bump, H[d.bump].value + +d.step); return; }
  const wrap = t.closest("[data-h]");
  if (wrap) {
    const k = wrap.dataset.h, kind = wrap.dataset.kind;
    if (kind === "lit") setValue(k, !H[k].value);
    else if (kind === "time" && d.step) shiftTime(k, +d.step);
    else if (kind === "rotary") d.opt ? setValue(k, d.opt) : cycleSelect(k);
    return;
  }
  if (d.solo) {
    ui.solo = ui.solo === d.solo ? null : d.solo;
    document.querySelectorAll("[data-solo]").forEach(b => b.setAttribute("aria-pressed", b.dataset.solo === ui.solo));
    renderBoard(); return;
  }
  if (t.id === "withHelpers") { ui.withHelpers = !ui.withHelpers; t.setAttribute("aria-pressed", ui.withHelpers); renderBoard(); return; }
  if (t.id === "clearFilters") {
    ui.q = ""; ui.solo = null; ui.withHelpers = false; document.getElementById("q").value = "";
    document.querySelectorAll("[data-solo]").forEach(b => b.setAttribute("aria-pressed", "false"));
    document.getElementById("withHelpers").setAttribute("aria-pressed", "false"); renderBoard(); return;
  }
  if (t.id === "profilesBtn") { toggleMenu(); return; }
  if (d.profile !== undefined) { applyProfile(+d.profile); closeMenu(); return; }
  if ("saveProfile" in d) { saveProfile(); closeMenu(); return; }
  if (t.id === "themeBtn") { cycleTheme(); return; }
});
document.getElementById("q").addEventListener("input", e => { ui.q = e.target.value.trim(); renderBoard(); });

/* Profiles */
function renderMenu() {
  document.getElementById("profilesMenu").innerHTML = profiles.map((p, i) =>
    `<button role="menuitem" data-profile="${i}">Apply ${esc(p.name)}<small>${esc(p.note)} · ${Object.keys(p.values).length} helpers</small></button>`).join("")
    + `<hr><button role="menuitem" data-save-profile>Save current values as a profile<small>Stores every helper on the board</small></button>`;
}
function toggleMenu() {
  const m = document.getElementById("profilesMenu"), b = document.getElementById("profilesBtn");
  const open = !m.classList.contains("open"); m.classList.toggle("open", open); b.setAttribute("aria-expanded", open);
  if (open) m.querySelector("button").focus();
}
function closeMenu() { document.getElementById("profilesMenu").classList.remove("open"); document.getElementById("profilesBtn").setAttribute("aria-expanded", "false"); }
function applyProfile(i) {
  const p = profiles[i];
  Object.entries(p.values).forEach(([k, v]) => setValue(k, v, true));
  toast(`Applied ${p.name} to ${Object.keys(p.values).length} helpers`);
}
function saveProfile() {
  const n = profiles.length + 1;
  profiles.push({ name: `Profile ${n}`, note: "Saved just now", values: Object.fromEntries(Object.entries(H).map(([k, h]) => [k, h.value])) });
  renderMenu(); toast(`Saved Profile ${n} with ${Object.keys(H).length} helpers`);
}

/* Theme: follows the system, the Panel key flips it */
function cycleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
}

renderSolo(); renderMenu(); renderBoard();
</script>
</body>
</html>
