<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixboard mockup v3</title>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
<style>
:root {
  --bg: #eef0f2; --card: #ffffff; --raised: #f6f7f8; --text: #1b1f24; --text2: #636b74; --line: #dfe3e7;
  --primary: #03a9f4; --on: #1f9d63; --off: #a7adb4; --snack: #262a2f;
  --covers: #4c7cf3; --lighting: #e89a1c; --climate: #e0603f; --notify: #6f8a7d;
  --shadow: 0 1px 2px rgba(20,30,40,.06), 0 4px 14px rgba(20,30,40,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111315; --card: #1b1e22; --raised: #23272c; --text: #e8eaed; --text2: #98a0a8; --line: #2e3338;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111315; --card: #1b1e22; --raised: #23272c; --text: #e8eaed; --text2: #98a0a8; --line: #2e3338;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.45 Figtree, system-ui, sans-serif; min-height: 100vh; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.mdi { font-size: 22px; line-height: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 24px; }
h1, h2, h3, .num { font-family: "Familjen Grotesk", Figtree, sans-serif; }

/* Top bar */
.top { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.top .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
.top h1 { font-size: 22px; margin: 0 auto 0 0; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--text); color: var(--card); display: grid; place-items: center; }
.logo .mdi { font-size: 20px; }
.btn { border: 0; cursor: pointer; border-radius: 12px; padding: 10px 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
.btn .mdi { font-size: 20px; }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--raised); }
.btn.soft { background: var(--raised); }
.btn.soft:hover { filter: brightness(.97); }
.btn.solid { background: var(--c, var(--primary)); color: #fff; }
.btn.solid:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon { border: 0; background: none; cursor: pointer; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--text2); flex: none; }
.icon:hover { background: var(--raised); color: var(--text); }

/* Switch */
.switch { position: relative; width: 52px; height: 30px; border-radius: 15px; border: 0; padding: 0; cursor: pointer; background: var(--off); transition: background .15s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--on); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }

/* Menus */
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 8; width: 290px; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); display: none; }
.menu.open { display: block; }
.menu button { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--raised); outline: 0; }
.menu .mdi { color: var(--text2); }
.menu b { font-weight: 600; display: block; }
.menu small { color: var(--text2); font-size: 13px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px; }

/* ── Overview ── */
.intro { padding: 28px 0 14px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.search { flex: 1; min-width: 240px; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.search:focus-within { border-color: var(--primary); }
.search .mdi { color: var(--text2); }
.search input { flex: 1; border: 0; outline: 0; background: none; font-size: 17px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 18px; }
.tab { border: 0; background: transparent; cursor: pointer; border-radius: 999px; padding: 8px 14px; color: var(--text2); font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.tab .cnt { font-weight: 500; font-size: 13px; opacity: .8; }
.tab:hover { background: var(--card); }
.tab[aria-pressed="true"] { background: var(--text); color: var(--card); }
.tab .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }

.group { margin-bottom: 26px; }
.group h2 { font-size: 15px; font-weight: 600; color: var(--text2); margin: 0 0 10px 4px; display: flex; gap: 8px; align-items: center; }
.group h2 .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.rows { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 16px; padding: 16px 12px 16px 20px; cursor: pointer; position: relative; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: var(--raised); }
.row::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); }
.row.off::before { background: var(--off); }
.row .main { flex: 1; min-width: 0; }
.row .name { font-family: "Familjen Grotesk", sans-serif; font-size: 19px; font-weight: 600; }
.row.off .name { color: var(--text2); }
.row .state { font-size: 14px; color: var(--text2); }
.vals { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.val { background: var(--raised); border-radius: 10px; padding: 4px 10px; white-space: nowrap; display: flex; gap: 6px; align-items: baseline; }
.val .l { font-size: 13px; color: var(--text2); }
.val .v { font-family: "Familjen Grotesk", sans-serif; font-weight: 700; font-size: 17px; }
.row.off .val .v { color: var(--text2); }
.chev { color: var(--text2); }
.more { margin: -8px 0 40px 4px; }
.more button { border: 0; background: none; color: var(--primary); font-weight: 600; cursor: pointer; padding: 8px 4px; }
.empty { background: var(--card); border-radius: 18px; padding: 32px 24px; box-shadow: var(--shadow); }
.empty p { font-size: 18px; margin: 0 0 12px; }

/* ── Detail ── */
.d-top { padding: 22px 0 8px; }
.backlink { border: 0; background: none; color: var(--text2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; padding: 6px 8px 6px 0; font-weight: 600; }
.backlink:hover { color: var(--text); }
.d-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
.d-icon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--c); color: #fff; flex: none; }
.d-icon .mdi { font-size: 30px; }
.d-head.off .d-icon { background: var(--off); }
.d-head h2 { font-size: 32px; margin: 0; line-height: 1.1; }
.d-head .state { color: var(--text2); }
.d-title { flex: 1; min-width: 220px; }
.enable { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 8px 10px 8px 16px; box-shadow: var(--shadow); font-weight: 600; }
.d-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 20px 0 6px; }
.d-actions .spacer { flex: 1; }
.hint { color: var(--text2); font-size: 14px; margin: 0 0 22px; }
.banner { display: flex; gap: 12px; align-items: center; background: var(--card); border-left: 4px solid var(--off); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; box-shadow: var(--shadow); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
#view { padding-bottom: 120px; }
.tile { background: var(--card); border-radius: 20px; padding: 18px 20px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.tile.wide { grid-column: 1 / -1; }
.t-label { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 17px; }
.t-label .mdi { color: var(--c); }
.t-label .via { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text2); background: var(--raised); padding: 2px 8px; border-radius: 8px; }
.big { display: flex; align-items: center; gap: 14px; }
.big .num { font-size: 46px; font-weight: 700; line-height: 1; flex: 1; letter-spacing: -.01em; }
.big .num small { font-size: 22px; font-weight: 600; color: var(--text2); margin-left: 4px; }
.round { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--raised); cursor: pointer; display: grid; place-items: center; flex: none; }
.round:hover { background: color-mix(in srgb, var(--c) 18%, var(--raised)); }
.round:active { transform: scale(.95); }
.round .mdi { font-size: 26px; }

/* Chunky slider */
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; cursor: pointer; margin: 0; }
.range::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: linear-gradient(to right, var(--c) calc(var(--p) * 100%), var(--raised) 0); }
.range::-moz-range-track { height: 12px; border-radius: 6px; background: var(--raised); }
.range::-moz-range-progress { height: 12px; border-radius: 6px; background: var(--c); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -8px; border-radius: 50%; background: #fff; border: 3px solid var(--c); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--c); }
.scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-top: -6px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.preset { border: 0; background: var(--raised); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.preset[aria-pressed="true"] { background: var(--c); color: #fff; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--raised); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 12px 8px; cursor: pointer; font-weight: 600; color: var(--text2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.bool { display: flex; align-items: center; gap: 16px; }
.bool .num { font-size: 40px; font-weight: 700; flex: 1; }
.bool .desc { color: var(--text2); font-size: 14px; }
.bool .switch { transform: scale(1.25); transform-origin: right center; }
.time-edit { border: 0; background: none; padding: 0; font: 700 46px/1 "Familjen Grotesk", sans-serif; width: 100%; min-width: 0; cursor: text; color: var(--text); }
.time-edit::-webkit-calendar-picker-indicator { display: none; }
.big .num:has(.time-edit) { min-width: 0; }
.glow { width: 52px; height: 52px; border-radius: 50%; flex: none; background: radial-gradient(circle, #ffd76a calc(var(--b) * .7%), rgba(255, 215, 106, 0) calc(30% + var(--b) * .4%)); border: 1px solid var(--line); }
.details { margin: 26px 0 0; }
.details summary { cursor: pointer; color: var(--text2); font-weight: 600; }
.details ul { margin: 8px 0 0; padding-left: 20px; color: var(--text2); font-size: 14px; font-family: ui-monospace, monospace; }

/* Snackbar */
.snack { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140px); z-index: 20; background: var(--snack); color: #fff; border-radius: 14px; padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 14px; min-height: 52px; box-shadow: 0 8px 24px rgba(0,0,0,.3); transition: transform .2s; max-width: calc(100% - 32px); }
.snack.show { transform: translate(-50%, 0); }
.snack button { border: 0; background: rgba(255,255,255,.12); color: #fff; font-weight: 600; border-radius: 10px; padding: 8px 14px; cursor: pointer; }

@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .row { flex-wrap: wrap; padding: 14px 8px 14px 18px; gap: 10px 12px; }
  .row .main { flex-basis: calc(100% - 130px); }
  .vals { order: 3; flex-basis: 100%; justify-content: flex-start; }
  .chev { display: none; }
  .d-head h2 { font-size: 26px; }
  .enable { width: 100%; justify-content: space-between; }
  .d-actions .btn { flex: 1; justify-content: center; }
  .d-actions .spacer { display: none; }
  .tiles { grid-template-columns: 1fr; }
  .snack { left: 16px; right: 16px; max-width: none; transform: translateY(140px); }
  .snack.show { transform: none; }
  .snack span { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1><span class="logo"><span class="mdi mdi-tune-vertical-variant"></span></span>Mixboard</h1>
  <div class="menu-wrap">
    <button class="btn ghost" id="profilesBtn" aria-haspopup="true" aria-expanded="false"><span class="mdi mdi-palette-swatch-outline"></span><span class="lbl">Profiles</span></button>
    <div class="menu" id="profilesMenu" role="menu"></div>
  </div>
  <button class="icon" id="themeBtn" aria-label="Toggle light or dark"><span class="mdi mdi-theme-light-dark"></span></button>
</div></header>

<main class="wrap" id="view"></main>
<div class="snack" id="snack" role="status" aria-live="polite"><span id="snackText"></span><button id="undoBtn">Undo</button></div>

<script>
const groups = [
  { id: "covers", name: "Covers", icon: "mdi-window-shutter", c: "var(--covers)" },
  { id: "lighting", name: "Lighting", icon: "mdi-lightbulb-on-outline", c: "var(--lighting)" },
  { id: "climate", name: "Climate", icon: "mdi-fan", c: "var(--climate)" },
  { id: "notify", name: "Notifications", icon: "mdi-bell-outline", c: "var(--notify)" },
];
const H = {
  sunset_delay:  { eid: "input_number.shutters_sunset_delay", name: "Wait after sunset", short: "wait", icon: "mdi-timer-sand", type: "number", min: 0, max: 120, step: 5, unit: "min", value: 30, presets: [0, 15, 30, 45, 60] },
  close_all:     { eid: "input_boolean.shutters_close_all", name: "Close every shutter", short: "all shutters", icon: "mdi-window-shutter", type: "boolean", value: true, desc: ["Only the living room closes", "All shutters close"] },
  mode:          { eid: "input_select.shutters_mode", name: "Shutter mode", short: "mode", icon: "mdi-shield-home-outline", type: "select", options: ["Normal", "Storm", "Holiday"], value: "Normal" },
  sunrise_delay: { eid: "input_number.shutters_sunrise_delay", name: "Wait after sunrise", short: "wait", icon: "mdi-timer-sand", type: "number", min: 0, max: 120, step: 5, unit: "min", value: 10, presets: [0, 10, 20, 30] },
  earliest_open: { eid: "input_datetime.shutters_earliest_open", name: "Never open before", short: "not before", icon: "mdi-clock-outline", type: "time", value: "07:30" },
  blackout_time: { eid: "input_datetime.bedroom_blackout_time", name: "Close at", short: "at", icon: "mdi-clock-outline", type: "time", value: "21:30" },
  night_level:   { eid: "input_number.hall_night_brightness", name: "Night brightness", short: "night", icon: "mdi-brightness-4", type: "number", min: 1, max: 100, step: 1, unit: "%", value: 20, glow: true, presets: [5, 10, 20, 40] },
  night_start:   { eid: "input_datetime.hall_night_start", name: "Night starts at", short: "from", icon: "mdi-weather-night", type: "time", value: "23:00" },
  night_end:     { eid: "input_datetime.hall_night_end", name: "Night ends at", short: "until", icon: "mdi-weather-sunset-up", type: "time", value: "06:30" },
  day_level:     { eid: "input_number.hall_day_brightness", name: "Day brightness", short: "day", icon: "mdi-brightness-6", type: "number", min: 1, max: 100, step: 1, unit: "%", value: 80, glow: true, presets: [50, 80, 100] },
  garden_offset: { eid: "input_number.garden_sunset_offset", name: "Turn on after sunset", short: "after sunset", icon: "mdi-timer-sand", type: "number", min: 0, max: 60, step: 5, unit: "min", value: 15, presets: [0, 15, 30] },
  garden_off:    { eid: "input_datetime.garden_off_time", name: "Turn off at", short: "off", icon: "mdi-clock-outline", type: "time", value: "22:00" },
  humidity:      { eid: "input_number.bath_humidity_threshold", name: "Start above humidity", short: "above", icon: "mdi-water-percent", type: "number", min: 40, max: 90, step: 1, unit: "%", value: 65, presets: [55, 65, 75] },
  runon:         { eid: "input_number.bath_fan_runon", name: "Keep running for", short: "run-on", icon: "mdi-timer-sand", type: "number", min: 0, max: 30, step: 1, unit: "min", value: 10, presets: [5, 10, 15] },
};
const automations = [
  { id: "sunset_shutters", name: "Sunset shutters", group: "covers", enabled: true, last: "today at 18:42", helpers: ["sunset_delay", "close_all", "mode"] },
  { id: "sunrise_shutters", name: "Sunrise shutters", group: "covers", enabled: true, last: "today at 07:55", helpers: ["sunrise_delay", "earliest_open", "mode"], via: { mode: "script.shutters_open" } },
  { id: "bedroom_blackout", name: "Bedroom blackout", group: "covers", enabled: false, last: "3 days ago", helpers: ["blackout_time"] },
  { id: "hall_night", name: "Hall night mode", group: "lighting", enabled: true, last: "yesterday at 23:00", helpers: ["night_level", "night_start", "night_end"] },
  { id: "hall_day", name: "Hall day brightness", group: "lighting", enabled: true, last: "today at 06:30", helpers: ["day_level"] },
  { id: "garden_path", name: "Garden path", group: "lighting", enabled: true, last: "yesterday at 17:21", helpers: ["garden_offset", "garden_off"] },
  { id: "bath_fan", name: "Bathroom fan", group: "climate", enabled: true, last: "today at 08:12", helpers: ["humidity", "runon"] },
  { id: "washer_done", name: "Washing machine done", group: "notify", enabled: true, last: "2 days ago", helpers: [] },
  { id: "door_open", name: "Front door left open", group: "notify", enabled: true, last: "never", helpers: [] },
];
const profiles = [
  { name: "Summer", note: "Late evenings, early mornings", values: { sunset_delay: 15, sunrise_delay: 0, garden_offset: 30, night_start: "23:30" } },
  { name: "Autumn", note: "Shutters later, lights sooner", values: { sunset_delay: 30, sunrise_delay: 10, garden_offset: 15, night_start: "23:00" } },
  { name: "Winter", note: "Dark early, slow mornings", values: { sunset_delay: 45, sunrise_delay: 20, garden_offset: 5, night_start: "22:30" } },
];

const ui = { q: "", group: null, showAll: false, open: null, scrollY: 0 };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const G = id => groups.find(g => g.id === id), A = id => automations.find(a => a.id === id);

function parts(h, v = h.value) {
  if (h.type === "boolean") return [v ? "On" : "Off", ""];
  if (h.type !== "number") return [v, ""];
  if (h.unit === "min" && v >= 60) { const m = v % 60; return [`${Math.floor(v / 60)}h${m ? String(m).padStart(2, "0") : ""}`, ""]; }
  return [String(v), h.unit];
}
const text = (h, v) => { const [n, u] = parts(h, v); return u ? `${n} ${u}`.replace(" %", "%") : n; };
const pct = h => (h.value - h.min) / (h.max - h.min);

/* ── Overview ── */
function visible(a) {
  if (ui.group && a.group !== ui.group) return false;
  if (!ui.q) return true;
  return [a.name, ...a.helpers.flatMap(k => [H[k].name, H[k].eid])].join(" ").toLowerCase().includes(ui.q.toLowerCase());
}
function rowHTML(a) {
  const g = G(a.group);
  return `<div class="row ${a.enabled ? "" : "off"}" role="link" tabindex="0" data-open="${a.id}" style="--c:${g.c}">
    <div class="main"><div class="name">${esc(a.name)}</div>
      <div class="state" data-state="${a.id}">${a.enabled ? "Last run " + esc(a.last) : "Disabled"}</div></div>
    <div class="vals">${a.helpers.slice(0, 3).map(k => `<span class="val"><span class="l">${esc(H[k].short)}</span><span class="v" data-v="${k}">${esc(text(H[k]))}</span></span>`).join("")}</div>
    <button class="switch" role="switch" data-toggle="${a.id}" aria-checked="${a.enabled}" aria-label="Enable ${esc(a.name)}"></button>
    <div class="menu-wrap"><button class="icon" data-runmenu="${a.id}" aria-label="Run ${esc(a.name)}" aria-haspopup="true"><span class="mdi mdi-play-circle-outline"></span></button>
      <div class="menu" data-menu="${a.id}" role="menu">
        <button role="menuitem" data-trigger="${a.id}"><span class="mdi mdi-play"></span><span><b>Trigger</b><small>Runs only if the conditions pass</small></span></button>
        <button role="menuitem" data-run="${a.id}"><span class="mdi mdi-skip-forward"></span><span><b>Run actions</b><small>Skips the conditions, runs right now</small></span></button>
      </div></div>
    <span class="mdi mdi-chevron-right chev"></span>
  </div>`;
}
function renderOverview() {
  const base = automations.filter(visible);
  const shown = base.filter(a => ui.showAll || a.helpers.length);
  const hidden = base.length - shown.length;
  const counts = id => automations.filter(a => (ui.showAll || a.helpers.length) && (!id || a.group === id)).length;
  $("#view").innerHTML = `
    <div class="intro"><label class="search"><span class="mdi mdi-magnify"></span><span class="sr">Search</span>
      <input id="q" type="search" placeholder="Search automations or settings" value="${esc(ui.q)}" autocomplete="off"></label></div>
    <div class="tabs" role="group" aria-label="Filter by category">
      <button class="tab" data-group="" aria-pressed="${!ui.group}">All <span class="cnt">${counts()}</span></button>
      ${groups.map(g => `<button class="tab" data-group="${g.id}" aria-pressed="${ui.group === g.id}" style="--c:${g.c}"><span class="sw"></span>${g.name} <span class="cnt">${counts(g.id)}</span></button>`).join("")}
    </div>
    <div id="groups">${groups.map(g => {
      const list = shown.filter(a => a.group === g.id);
      return list.length ? `<section class="group" style="--c:${g.c}"><h2><span class="sw"></span>${g.name}</h2><div class="rows">${list.map(rowHTML).join("")}</div></section>` : "";
    }).join("") || `<div class="empty"><p>Nothing matches “${esc(ui.q)}”.</p><button class="btn soft" data-clear>Clear the search</button></div>`}</div>
    ${hidden ? `<div class="more"><button data-showall>Show ${hidden} automation${hidden > 1 ? "s" : ""} without settings</button></div>`
      : ui.showAll ? `<div class="more"><button data-showall>Hide automations without settings</button></div>` : ""}`;
}

/* ── Detail ── */
function tileHTML(k, a) {
  const h = H[k], via = a.via && a.via[k];
  const label = `<div class="t-label"><span class="mdi ${h.icon}"></span><span title="${h.eid}">${esc(h.name)}</span>${via ? `<span class="via" title="This helper is used by ${via}, which the automation calls">via script</span>` : ""}</div>`;
  if (h.type === "number") {
    const [n, u] = parts(h);
    return `<div class="tile" data-tile="${k}">${label}
      <div class="big">
        <button class="round" data-inc="${k}" data-d="-1" aria-label="Lower ${esc(h.name)}"><span class="mdi mdi-minus"></span></button>
        <div class="num" data-num="${k}">${esc(n)}<small>${esc(u)}</small></div>
        ${h.glow ? `<span class="glow" data-glow="${k}" style="--b:${h.value}" aria-hidden="true"></span>` : ""}
        <button class="round" data-inc="${k}" data-d="1" aria-label="Raise ${esc(h.name)}"><span class="mdi mdi-plus"></span></button>
      </div>
      <div><input class="range" type="range" data-range="${k}" min="${h.min}" max="${h.max}" step="${h.step}" value="${h.value}" style="--p:${pct(h)}" aria-label="${esc(h.name)}" aria-valuetext="${text(h)}">
      <div class="scale"><span>${text(h, h.min)}</span><span>${text(h, h.max)}</span></div></div>
      ${h.presets ? `<div class="presets">${h.presets.map(p => `<button class="preset" data-preset="${k}" data-val="${p}" aria-pressed="${p === h.value}">${p === 0 && h.unit === "min" ? "No wait" : esc(text(h, p))}</button>`).join("")}</div>` : ""}
    </div>`;
  }
  if (h.type === "boolean") return `<div class="tile" data-tile="${k}">${label}
      <div class="bool"><div><div class="num" data-num="${k}">${h.value ? "On" : "Off"}</div><div class="desc" data-desc="${k}">${esc(h.desc[h.value ? 1 : 0])}</div></div>
      <button class="switch" role="switch" data-bool="${k}" aria-checked="${h.value}" aria-label="${esc(h.name)}"></button></div></div>`;
  if (h.type === "select") return `<div class="tile" data-tile="${k}">${label}
      <div class="seg" role="radiogroup" aria-label="${esc(h.name)}">${h.options.map(o => `<button role="radio" data-opt="${k}" data-val="${esc(o)}" aria-checked="${o === h.value}" aria-pressed="${o === h.value}">${esc(o)}</button>`).join("")}</div></div>`;
  return `<div class="tile" data-tile="${k}">${label}
      <div class="big">
        <button class="round" data-shift="${k}" data-m="-15" aria-label="15 minutes earlier"><span class="mdi mdi-minus"></span></button>
        <div class="num"><input class="time-edit" type="time" data-time="${k}" value="${h.value}" aria-label="${esc(h.name)}"></div>
        <button class="round" data-shift="${k}" data-m="15" aria-label="15 minutes later"><span class="mdi mdi-plus"></span></button>
      </div>
      <div class="scale" style="margin:0"><span>−15 min</span><span>tap the time to type it</span><span>+15 min</span></div></div>`;
}
function renderDetail() {
  const a = A(ui.open), g = G(a.group);
  $("#view").innerHTML = `<div style="--c:${g.c}">
    <div class="d-top">
      <button class="backlink" data-back><span class="mdi mdi-arrow-left"></span>All automations</button>
      <div class="d-head ${a.enabled ? "" : "off"}">
        <div class="d-icon"><span class="mdi ${g.icon}"></span></div>
        <div class="d-title"><h2>${esc(a.name)}</h2><div class="state" data-state="${a.id}">${a.enabled ? "Last run " + esc(a.last) : "Disabled"}</div></div>
        <label class="enable"><span>${a.enabled ? "Enabled" : "Disabled"}</span><button class="switch" role="switch" data-toggle="${a.id}" aria-checked="${a.enabled}" aria-label="Enabled"></button></label>
      </div>
      <div class="d-actions">
        <button class="btn solid" data-trigger="${a.id}" ${a.enabled ? "" : "disabled"}><span class="mdi mdi-play"></span>Trigger</button>
        <button class="btn soft" data-run="${a.id}"><span class="mdi mdi-skip-forward"></span>Run actions</button>
        <span class="spacer"></span>
        <button class="btn ghost"><span class="mdi mdi-chart-timeline-variant"></span>Traces</button>
        <button class="btn ghost"><span class="mdi mdi-pencil-outline"></span>Edit in HA</button>
      </div>
      <p class="hint">Trigger runs only if the conditions pass. Run actions skips them. Changes below apply right away.</p>
    </div>
    ${a.enabled ? "" : `<div class="banner"><span class="mdi mdi-pause-circle-outline"></span>This automation is off. Your settings stay as they are and apply when you turn it back on.</div>`}
    ${a.helpers.length ? `<div class="tiles">${a.helpers.map(k => tileHTML(k, a)).join("")}</div>`
      : `<div class="tiles"><div class="tile wide"><div class="t-label"><span class="mdi mdi-tune-variant"></span>No settings yet</div>
        <div style="color:var(--text2)">This automation doesn't use any input helpers. Add one in Home Assistant, for example a number helper for a delay, and it appears here.</div></div></div>`}
    ${a.helpers.length ? `<details class="details"><summary>Linked helpers</summary><ul>${a.helpers.map(k => `<li>${H[k].eid}</li>`).join("")}</ul></details>` : ""}
  </div>`;
}
function render() { ui.open ? renderDetail() : renderOverview(); }
function go(id) {
  if (id) ui.scrollY = scrollY;
  ui.open = id; render();
  scrollTo(0, id ? 0 : ui.scrollY);
  const f = id ? $("[data-back]") : $(`[data-open="${prevOpen}"]`); if (f) f.focus({ preventScroll: true });
  prevOpen = id || prevOpen;
}
let prevOpen = null;

/* ── Values + undo ── */
let pending = {}, settle, snackTimer, undoFn = null;
function setValue(k, v, silent) {
  const h = H[k];
  if (h.type === "number") v = Math.min(h.max, Math.max(h.min, Math.round(v / h.step) * h.step));
  if (h.value === v) return;
  if (!silent && !(k in pending)) pending[k] = h.value;
  h.value = v; sync(k);
  if (!silent) { clearTimeout(settle); settle = setTimeout(commit, 600); }
}
function commit() {
  const ch = Object.entries(pending); pending = {};
  if (!ch.length) return;
  const k = ch[0][0];
  snack(ch.length === 1 ? `${H[k].name}: ${text(H[k])}` : `${ch.length} settings changed`, () => ch.forEach(([k, p]) => setValue(k, p, true)));
}
function snack(msg, undo) {
  $("#snackText").textContent = msg; undoFn = undo || null;
  $("#undoBtn").style.display = undo ? "" : "none";
  $("#snack").classList.add("show");
  clearTimeout(snackTimer); snackTimer = setTimeout(() => $("#snack").classList.remove("show"), 5000);
}
function sync(k) {
  const h = H[k], [n, u] = parts(h);
  document.querySelectorAll(`[data-num="${k}"]`).forEach(e => e.innerHTML = `${esc(n)}${u ? `<small>${esc(u)}</small>` : ""}`);
  document.querySelectorAll(`[data-v="${k}"]`).forEach(e => e.textContent = text(h));
  document.querySelectorAll(`[data-range="${k}"]`).forEach(e => { if (+e.value !== h.value) e.value = h.value; e.style.setProperty("--p", pct(h)); e.setAttribute("aria-valuetext", text(h)); });
  document.querySelectorAll(`[data-glow="${k}"]`).forEach(e => e.style.setProperty("--b", h.value));
  document.querySelectorAll(`[data-preset="${k}"]`).forEach(e => e.setAttribute("aria-pressed", +e.dataset.val === h.value));
  document.querySelectorAll(`[data-bool="${k}"]`).forEach(e => e.setAttribute("aria-checked", h.value));
  document.querySelectorAll(`[data-desc="${k}"]`).forEach(e => e.textContent = h.desc[h.value ? 1 : 0]);
  document.querySelectorAll(`[data-opt="${k}"]`).forEach(e => { const on = e.dataset.val === h.value; e.setAttribute("aria-pressed", on); e.setAttribute("aria-checked", on); });
  document.querySelectorAll(`[data-time="${k}"]`).forEach(e => { if (e !== document.activeElement || e.value !== h.value) e.value = h.value; });
}
function shift(k, m) {
  const [hh, mm] = H[k].value.split(":").map(Number), t = ((hh * 60 + mm + m) % 1440 + 1440) % 1440;
  setValue(k, `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`);
}
function setEnabled(id, on, silent) {
  A(id).enabled = on; render();
  if (!silent) snack(`${A(id).name} turned ${on ? "on" : "off"}`, () => setEnabled(id, !on, true));
}
function closeMenus() { document.querySelectorAll(".menu.open").forEach(m => m.classList.remove("open")); $("#profilesBtn").setAttribute("aria-expanded", "false"); }

/* ── Events ── */
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-open]");
  if (!t) { closeMenus(); return; }
  const d = t.dataset;
  if (d.runmenu) { const m = document.querySelector(`[data-menu="${d.runmenu}"]`), open = !m.classList.contains("open"); closeMenus(); m.classList.toggle("open", open); if (open) m.querySelector("button").focus(); return; }
  if (d.trigger || d.run) {
    const a = A(d.trigger || d.run); closeMenus();
    if (d.trigger && !a.enabled) { snack(`${a.name} is off. Turn it on first, or use Run actions.`); return; }
    a.last = "just now"; document.querySelectorAll(`[data-state="${a.id}"]`).forEach(x => x.textContent = "Last run just now");
    snack(d.trigger ? `${a.name} triggered` : `${a.name}: actions ran`); return;
  }
  if (d.toggle) { setEnabled(d.toggle, !A(d.toggle).enabled); return; }
  if (d.profile !== undefined) { applyProfile(+d.profile); closeMenus(); return; }
  if ("save" in d) { saveProfile(); closeMenus(); return; }
  if (t.id === "profilesBtn") { const m = $("#profilesMenu"), open = !m.classList.contains("open"); closeMenus(); m.classList.toggle("open", open); t.setAttribute("aria-expanded", open); return; }
  if (t.id === "themeBtn") { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; return; }
  if (t.id === "undoBtn") { if (undoFn) undoFn(); undoFn = null; $("#snack").classList.remove("show"); return; }
  if ("back" in d) { go(null); return; }
  if (d.inc) { setValue(d.inc, H[d.inc].value + H[d.inc].step * +d.d); return; }
  if (d.preset) { setValue(d.preset, +d.val); return; }
  if (d.bool) { setValue(d.bool, !H[d.bool].value); return; }
  if (d.opt) { setValue(d.opt, d.val); return; }
  if (d.shift) { shift(d.shift, +d.m); return; }
  if (d.group !== undefined) { ui.group = d.group || null; renderOverview(); return; }
  if ("showall" in d) { ui.showAll = !ui.showAll; renderOverview(); return; }
  if ("clear" in d) { ui.q = ""; ui.group = null; renderOverview(); $("#q").focus(); return; }
  if (d.open && !e.target.closest(".menu-wrap, .switch")) { go(d.open); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (document.querySelector(".menu.open")) closeMenus(); else if (ui.open) go(null); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".row")) { e.preventDefault(); go(e.target.dataset.open); }
});
document.addEventListener("input", e => {
  if (e.target.dataset.range) setValue(e.target.dataset.range, +e.target.value);
  if (e.target.id === "q") { ui.q = e.target.value.trim(); const pos = e.target.selectionStart; renderOverview(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => { if (e.target.dataset.time && e.target.value) setValue(e.target.dataset.time, e.target.value); });

function renderProfiles() {
  $("#profilesMenu").innerHTML = profiles.map((p, i) => `<button role="menuitem" data-profile="${i}"><span class="mdi mdi-palette-swatch-outline"></span><span><b>${esc(p.name)}</b><small>${esc(p.note)} · ${Object.keys(p.values).length} settings</small></span></button>`).join("")
    + `<hr><button role="menuitem" data-save><span class="mdi mdi-content-save-outline"></span><span><b>Save current settings</b><small>As a new profile you can apply later</small></span></button>`;
}
function applyProfile(i) {
  const p = profiles[i], prev = {};
  Object.entries(p.values).forEach(([k, v]) => { prev[k] = H[k].value; setValue(k, v, true); });
  snack(`${p.name} applied to ${Object.keys(p.values).length} settings`, () => Object.entries(prev).forEach(([k, v]) => setValue(k, v, true)));
}
function saveProfile() {
  profiles.push({ name: `Profile ${profiles.length + 1}`, note: "Saved just now", values: Object.fromEntries(Object.entries(H).map(([k, h]) => [k, h.value])) });
  renderProfiles(); snack(`Saved as ${profiles.at(-1).name}`);
}

renderProfiles(); render();
</script>
</body>
</html>
