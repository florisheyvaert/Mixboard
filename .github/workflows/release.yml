name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set manifest version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/mixboard/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/mixboard/manifest.json

      - name: Create release zip
        # HACS extracts the zip into custom_components/mixboard, so zip the folder's contents.
        working-directory: custom_components/mixboard
        run: zip -r ../../mixboard.zip . -x ".gitkeep" "*/.gitkeep" "__pycache__/*"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: mixboard.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
